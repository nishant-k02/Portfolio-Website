<!doctype html>
<html
  lang="en"
  class="dark scrollbar-thin scrollbar-track-ink-900 scrollbar-thumb-ink-600"
>
  <head>
    <!-- Theme initialization script - MUST be first -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("theme");
          const isDark = savedTheme ? savedTheme === "dark" : true;
          document.documentElement.classList.remove("dark");
          if (isDark) document.documentElement.classList.add("dark");
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? "dark" : "light",
          );
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Critical CSS to prevent theme flash -->
    <style>
      html.dark {
        background-color: #090c1c !important;
        color: #f5f6fb !important;
      }
      html:not(.dark) {
        background-color: #f7f7fb !important;
        color: #0f1329 !important;
      }
      body {
        transition: none !important;
      }
      .theme-loaded body {
        transition:
          background-color 0.3s ease,
          color 0.3s ease !important;
      }
    </style>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nishant Khandhar - Software Engineer</title>
    <meta
      name="description"
      content="Nishant Khandhar - Software Engineer building full-stack products and AI-driven systems."
    />
    <meta name="theme-color" content="#090c1c" />

    <link rel="shortcut icon" href="/images/profile2.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
